<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Maps Pro - Navigation Dashboard</title>
    
    <!-- 1. HIGH-SPEED LEAFLET ARCHITECTURE CSS STYLE SYSTEM (Loads first to prevent broken invisible maps) -->
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-Zcn6xFREG0W74Z1zZ8bXzV8vQe4J88kZ+OQO5S3S6p0H/J9G7r5C2hA8zWw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <style>
        /* ABSOLUTE CANVAS VIEWPORT MATRIX OVERRIDES */
        html, body { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background-color: #0b0f19 !important; }
        
        /* INDEPENDENT DIMENSIONAL MAPPING BOX GRID WINDOW */
        #map { 
            position: absolute !important; 
            top: 0 !important; 
            bottom: 0 !important; 
            left: 0 !important; 
            right: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important; 
            background: #0b0f19 !important; 
            z-index: 1; 
        }

        /* PREMIUM CONTROLS FLOATING DASHBOARD LAYER PANEL CARDS */
        .floating-card {
            position: absolute;
            background: rgba(16, 22, 37, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            color: #ffffff;
        }

        .top-right-controls { top: 20px; right: 20px; width: 240px; }
        .bottom-telemetry { bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; justify-content: space-around; text-align: center; }
        .top-left-gear { top: 20px; left: 20px; }

        .card-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 6px; }
        
        select {
            width: 100%;
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .btn-action {
            width: 100%;
            background: #10b981;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #059669; }

        .telemetry-item { display: flex; flex-direction: column; }
        .telemetry-val { font-size: 1.5rem; font-weight: 800; color: #38bdf8; font-family: monospace; }
        .telemetry-unit { font-size: 0.7rem; color: #64748b; margin-left: 2px; }

        #network-status { font-size: 0.85rem; font-weight: bold; color: #10b981; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <!-- MAP VISUAL LAYOUT CORE PORT CONTAINER CANVAS -->
    <div id="map"></div>

    <!-- UPPER LEFT DATA FLUSH ENGINE HANDLER TRIGGER BUTTON -->
    <div class="floating-card top-left-gear">
        <button onclick="triggerVaporizeSync()" style="background:none; border:none; font-size:1.3rem; cursor:pointer;">⚙️</button>
    </div>

    <!-- UPPER RIGHT LAYOUT LAYER SELECTION MENU & DOWNLOAD SYSTEM -->
    <div class="floating-card top-right-controls">
        <div class="card-label">Map Views</div>
        <select id="map-view-selector" onchange="handleLayerSwitch(this.value)">
            <option value="road">🗺️ Base Street Map (Free)</option>
            <option value="topo">⛰️ Topo Terrain Pack ($1.99)</option>
            <option value="marine">⚓ Marine Depth Layers ($1.99)</option>
        </select>
        <button class="btn-action" onclick="alert('Region cache queued! Map data download initialized for offline standby mode.')">📥 Save Region</button>
    </div>

    <!-- BOTTOM INSTRUMENT PANEL FOR REAL-TIME SIMULATED SENSOR DATA -->
    <div class="floating-card bottom-telemetry">
        <div class="telemetry-item">
            <span class="card-label">Speed</span>
            <span class="telemetry-val" id="speed-val">0.0<span class="telemetry-unit">KTS</span></span>
        </div>
        <div class="telemetry-item">
            <span class="card-label">Elevation</span>
            <span class="telemetry-val" id="elevation-val">0<span class="telemetry-unit">M</span></span>
        </div>
        <div class="telemetry-item">
            <span class="card-label">Status</span>
            <div id="network-status">● Online</div>
        </div>
    </div>

    <!-- 2. LEAFLET RUNTIME ENGINE JAVASCRIPT CORES (Compiles before running your local application script) -->
    <script src="https://cloudflare.com" integrity="sha512-Bw3bTAs4XwYl9wX8+b3w24w6Xm+S8N3C0WbH+uO1mQ2oF94fFw/D5uO7N5yN/X30YwM6P6K482U5F7N8Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- 3. MAIN COMPUTATION FUNCTION PIPELINE LINKS -->
    <script src="app.js"></script>
</body>
</html>
