<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Explorer Pro Maps</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html, #map { height: 100%; width: 100vw; background: #111; overflow: hidden; }
        
        .floating-panel { position: absolute; z-index: 1000; background: rgba(17, 24, 39, 0.95); border: 1px solid #374151; padding: 12px; border-radius: 12px; color: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); backdrop-filter: blur(8px); }
        #layer-panel { top: 12px; right: 12px; width: 160px; }
        #instrument-panel { bottom: 24px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; display: flex; justify-content: space-around; text-align: center; }
        #settings-btn { top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; }
        
        h4 { font-size: 11px; text-transform: uppercase; color: #9CA3AF; margin-bottom: 6px; }
        .stat-val { font-size: 22px; font-weight: bold; color: #3B82F6; }
        .unit { font-size: 10px; color: #6B7280; margin-left: 2px; }
        
        select, button { width: 100%; padding: 8px; background: #1F2937; border: 1px solid #4B5563; border-radius: 6px; color: white; cursor: pointer; margin-top: 4px; font-size: 13px; }
        button:hover { background: #374151; }
        .danger-btn { background: #DC2626; border-color: #EF4444; margin-top: 12px; }
        
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #1F2937; width: 90%; max-width: 400px; padding: 24px; border-radius: 16px; color: white; border: 1px solid #374151; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; }
        #status-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10B981; margin-right: 4px; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="settings-btn" class="floating-panel" onclick="toggleModal(true)">⚙️</div>

    <div id="layer-panel" class="floating-panel">
        <h4>Map Views</h4>
        <select id="map-style-select" onchange="changeMapLayer(this.value)">
            <option value="marine">🌊 Marine View</option>
            <option value="land">🏞️ Topo Land</option>
            <option value="hiking">🥾 Hiking Trail</option>
            <option value="satellite">🛰️ Satellite</option>
            <option value="driving">🚗 Road Drive</option>
        </select>
        <button onclick="downloadActiveRegion()" style="background:#059669; margin-top:10px;">📥 Save Region</button>
    </div>

    <div id="instrument-panel" class="floating-panel">
        <div>
            <h4>Speed</h4>
            <div id="dash-speed" class="stat-val">0.0<span class="unit" id="speed-unit">KTS</span></div>
        </div>
        <div>
            <h4>Elevation</h4>
            <div id="dash-alt" class="stat-val">0<span class="unit">M</span></div>
        </div>
        <div>
            <h4>Status</h4>
            <div style="font-size:14px; margin-top:6px;"><span id="status-indicator"></span><span id="status-text">Online</span></div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:12px;">App Configurations</h3>
            <div class="toggle-row">
                <label>High-Accuracy GPS</label>
                <input type="checkbox" id="cfg-gps" checked onchange="updateSettingsObject()">
            </div>
            <div class="toggle-row">
                <label>Instrument Panel</label>
                <input type="checkbox" id="cfg-dash" checked onchange="updateSettingsObject()">
            </div>
            <h4 style="margin-top:16px;">Map Layer Data Actions</h4>
            <button onclick="plotManualWaypoint()" style="background:#2563EB;">📍 Place Mark at Location</button>
            <button class="danger-btn" onclick="toggleModal(false)">Close Panel</button>
        </div>
    </div>

    <script src="https://unpkg.com"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Active"))
                .catch(err => console.error("Worker Registration Halted", err));
        }
    </script>
</body>
</html>
